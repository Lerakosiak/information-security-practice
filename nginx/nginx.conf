events {
    worker_connections 1024;
}

http {
    # Security headers на рівні Nginx для захисту користувачів
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Обмеження розміру тіла запиту (захист від завантаження гігантських файлів)
    client_max_body_size 1m;

    # Rate limiting zone (обмеження частоти запитів для захисту від DDoS та Bruteforce)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # Конфігурація захищеного HTTPS сервера
    server {
        listen 443 ssl;
        server_name localhost;

        # Шляхи до наших згенерованих TLS-сертифікатів всередині контейнера
        ssl_certificate /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        
        # Використання сучасних та надійних протоколів шифрування
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Автоматичний редирект з незахищеного HTTP (порт 80) на захищений HTTPS (порт 443)
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}